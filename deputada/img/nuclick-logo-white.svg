<svg width="210" height="52" viewBox="0 0 210 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="NuClick Sistemas">
  <defs>
    <linearGradient id="bgGradW" x1="0" y1="0" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Símbolo -->
  <rect x="1" y="5" width="44" height="42" rx="13" fill="url(#bgGradW)"/>
  <rect x="1" y="5" width="44" height="21" rx="13" fill="white" opacity="0.1"/>

  <circle cx="11" cy="16" r="2.8" fill="white" opacity="0.95"/>
  <circle cx="35" cy="16" r="2.8" fill="white" opacity="0.95"/>
  <circle cx="11" cy="36" r="2.8" fill="white" opacity="0.95"/>
  <circle cx="35" cy="36" r="2.8" fill="white" opacity="0.95"/>
  <line x1="11" y1="16" x2="11" y2="36" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="11" y1="16" x2="35" y2="36" stroke="white" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="35" y1="16" x2="35" y2="36" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Wordmark branco (para fundos escuros) -->
  <text x="56" y="28" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="22" fill="white" letter-spacing="-0.5">Nu</text>
  <text x="84" y="28" font-family="'Inter', system-ui, sans-serif" font-weight="300" font-size="22" fill="white" letter-spacing="-0.5">Click</text>

  <!-- Ponto acento -->
  <circle cx="150" cy="9" r="4" fill="#818CF8"/>
  <circle cx="150" cy="9" r="7" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="56" y="43" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="9" fill="#A5B4FC" letter-spacing="3">SISTEMAS</text>
</svg>
