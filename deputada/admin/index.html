<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Mandato — Roberta Lopes</title>
<style>
:root{--g9:#062a13;--g7:#0e5427;--g6:#13703a;--y:#f4ec12;--bg:#f3f1e8;--line:#dcd8c6;--ink:#0a130d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(6,42,19,.18)}
h1{margin:0 0 6px;font-size:1.5rem;color:var(--g9)}
.sub{color:#5b675f;margin:0 0 22px;font-size:.92rem}
label{display:block;font-weight:700;font-size:.82rem;margin:14px 0 6px;color:var(--g9)}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:90px;resize:vertical}
.btn{border:0;background:var(--g7);color:#fff;border-radius:99px;padding:12px 24px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--g6)}
.btn.sec{background:transparent;color:var(--g7);border:2px solid var(--g7)}
.btn.warn{background:#a32b2b}
.btn.sm{padding:7px 14px;font-size:.8rem}
.msg{padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.88rem;display:none}
.msg.err{display:block;background:#fdeaea;color:#8c2222}.msg.ok{display:block;background:#e5f4e8;color:#1f6a35}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--g9);color:#fff;padding:26px 16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h2{margin:0 0 4px;font-size:1.1rem}aside small{opacity:.7}
aside nav{margin-top:22px;display:grid;gap:3px}
aside button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;opacity:.82}
aside button.on,aside button:hover{background:rgba(255,255,255,.12);opacity:1}
aside .grp{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin:16px 12px 4px}
main{padding:32px clamp(18px,3vw,44px);max-width:1100px}
main h1{font-size:1.8rem}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.grid .full{grid-column:1/-1}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row b{display:block}.row small{color:#5b675f}
.row .acts{display:flex;gap:8px;flex:none}
.pill{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--y);color:var(--g9);margin-left:8px}
.pill.off{background:#ddd;color:#555}
.hint{font-size:.78rem;color:#6a756d;margin-top:4px}
.cfgrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.thumb{height:64px;border-radius:6px;margin-top:8px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.grid{grid-template-columns:1fr}.cfgrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form class="box" id="formLogin">
    <h1>Painel do Mandato</h1>
    <p class="sub">Entre com o e-mail e a senha da área administrativa.</p>
    <div class="msg" id="loginMsg"></div>
    <label>E-mail</label><input type="email" id="email" required autocomplete="username">
    <label>Senha</label><input type="password" id="senha" required autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:20px">Entrar</button>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside>
    <h2>Roberta Lopes</h2><small>Painel do mandato</small>
    <nav id="menu"></nav>
    <button style="margin-top:22px;opacity:.7" id="sair">Sair</button>
  </aside>
  <main id="view"></main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
